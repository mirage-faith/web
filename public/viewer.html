<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewer · MIRAGE</title>
  <meta name="theme-color" content="#fdf5ea">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23144049'/%3E%3Ctext x='32' y='31' font-family='Georgia' font-size='26' fill='%23f2f7f7' text-anchor='middle'%3EM%3C/text%3E%3Cline x1='16' y1='34.5' x2='48' y2='34.5' stroke='%2364b1bc' stroke-width='1.6' stroke-linecap='round'/%3E%3Ctext x='32' y='31' font-family='Georgia' font-size='26' fill='%2364b1bc' text-anchor='middle' opacity='0.45' transform='translate(0,70.5) scale(1,-1)'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
  <style>
    /*
      Generalized full-screen image viewer for the whole site.
      Link with query params (same-origin absolute paths only):
        /viewer?img=/path/to/image.png&pdf=/path/to/print.pdf&back=/path/&title=Label
      Only `img` is required. Natural size is auto-detected, so this file
      never needs per-image constants. Prefer a transparent PNG for `img`
      so it sits seamlessly on the cream background.
      Zoom lessons baked in: fit-to-viewport baseline (never wider than the
      page on load, so mobile is safe); the image is flex:none so zooming
      truly grows it past the viewport and scrolls (flex-shrink was the
      old stall); zoom buttons hidden on phones (pinch is natural).
    */
    * { margin: 0; box-sizing: border-box; }
    body { background: #fdf5ea; font-family: Fraunces, Georgia, serif; min-height: 100vh; }
    .stage { min-height: 100vh; display: flex; padding: 5rem 1rem 2rem; }
    .stage img { flex: none; margin: auto; display: block; height: auto; transition: width .18s ease-out; }

    .back { position: fixed; top: 1.05rem; left: 1.1rem; z-index: 10; color: #7a6a4b; text-decoration: none; font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; }
    .back:hover { color: #3b2f14; }

    .ctl { position: fixed; top: .9rem; right: 1rem; z-index: 10; display: flex; align-items: center; gap: .5rem;
      background: rgba(253,245,234,.9); backdrop-filter: blur(8px); border: 1px solid #e6dcc7; border-radius: 999px;
      padding: .35rem .4rem; box-shadow: 0 10px 30px -18px rgba(59,47,20,.5); }
    .ctl button { width: 2.1rem; height: 2.1rem; border-radius: 999px; border: 1px solid #e6dcc7; background: #fff;
      color: #3b2f14; font-size: 1.2rem; line-height: 1; cursor: pointer; display: grid; place-items: center; transition: background .15s, border-color .15s; }
    .ctl button:hover { background: #f3ead8; border-color: #d8c9a8; }
    .ctl button:disabled { opacity: .4; cursor: default; }
    .ctl .pct { min-width: 3.1rem; text-align: center; font-family: Inter, system-ui, sans-serif; font-size: .82rem; color: #7a6a4b; }
    .ctl .pdf { display: inline-flex; align-items: center; gap: .45rem; text-decoration: none; white-space: nowrap;
      color: #f6f0e2; background: #3b2f14; border-radius: 999px; padding: .5rem 1.1rem; font-size: .95rem; margin-left: .25rem; transition: background .2s; }
    .ctl .pdf:hover { background: #574422; }
    @media (max-width: 640px) {
      .ctl #out, .ctl #in, .ctl .pct { display: none; }
      .ctl { padding: 0; border: 0; background: none; box-shadow: none; }
    }
  </style>
</head>
<body>
  <a class="back" id="back" href="/">&larr; Back</a>
  <div class="ctl">
    <button id="out" type="button" aria-label="Zoom out">&minus;</button>
    <span class="pct" id="pct">Fit</span>
    <button id="in" type="button" aria-label="Zoom in">+</button>
    <a class="pdf" id="pdf" hidden target="_blank" rel="noopener">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V4h12v5"></path><path d="M6 18H4v-6h16v6h-2"></path><path d="M8 14h8v6H8z"></path></svg>
      <span>Printable (PDF)</span>
    </a>
  </div>
  <div class="stage"><img id="img" alt=""></div>

  <script>
    (() => {
      const MIN = 100, MAX = 300, STEP = 25;   // Fit .. 3x fit
      const q = new URLSearchParams(location.search);
      // same-origin absolute paths only (no external URLs, no attribute breakers)
      const safe = (p) => {
        if (!p) return null;
        try { p = decodeURIComponent(p); } catch { return null; }
        if (!p.startsWith("/") || p.startsWith("//")) return null;
        if (/[<>"'\\]/.test(p)) return null;
        return p;
      };
      const img = document.getElementById("img");
      const pct = document.getElementById("pct");
      const zin = document.getElementById("in");
      const zout = document.getElementById("out");
      const pdf = document.getElementById("pdf");
      const back = document.getElementById("back");

      const title = q.get("title");
      if (title) document.title = title.replace(/[<>]/g, "") + " · MIRAGE";
      const backHref = safe(q.get("back"));
      if (backHref) back.href = backHref;
      const pdfHref = safe(q.get("pdf"));
      if (pdfHref) { pdf.href = pdfHref; pdf.hidden = false; }

      const src = safe(q.get("img"));
      if (!src) { img.alt = "No image specified."; return; }
      if (title) img.alt = title.replace(/[<>]/g, "");

      let z = 100, NAT_W = 0, ASPECT = 1;
      const fitWidth = () => {
        const availW = window.innerWidth - 24;
        const availH = window.innerHeight - 108;
        return Math.max(140, Math.min(NAT_W || availW, availW, availH * ASPECT));
      };
      const apply = () => {
        if (!NAT_W) return;
        img.style.width = Math.round(fitWidth() * z / 100) + "px";
        pct.textContent = z === 100 ? "Fit" : z + "%";
        zin.disabled = z >= MAX;
        zout.disabled = z <= MIN;
      };
      img.addEventListener("load", () => { NAT_W = img.naturalWidth || 1000; ASPECT = img.naturalWidth / img.naturalHeight || 1; apply(); });
      zin.addEventListener("click", () => { z = Math.min(MAX, z + STEP); apply(); });
      zout.addEventListener("click", () => { z = Math.max(MIN, z - STEP); apply(); });
      window.addEventListener("resize", apply);
      img.src = src;
    })();
  </script>
</body>
</html>
