<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Library · MMM · mirage.faith</title>
  <meta name="description" content="Every month we gather, we capture the teaching. The Monthly Marriage Meetup library: talks, handouts, and takeaways, free to anyone.">
  <meta property="og:title" content="The MMM Library">
  <meta property="og:description" content="Every month's teaching, handout, and takeaway from the Monthly Marriage Meetup, free to anyone.">
  <meta property="og:url" content="https://mirage.faith/mmm/library/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#3b2f14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23144049'/%3E%3Ctext x='32' y='31' font-family='Georgia' font-size='26' fill='%23f2f7f7' text-anchor='middle'%3EM%3C/text%3E%3Cline x1='16' y1='34.5' x2='48' y2='34.5' stroke='%2364b1bc' stroke-width='1.6' stroke-linecap='round'/%3E%3Ctext x='32' y='31' font-family='Georgia' font-size='26' fill='%2364b1bc' text-anchor='middle' opacity='0.45' transform='translate(0,70.5) scale(1,-1)'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #64b1bc; --teal-ink: #0d2b31; --paper: #f7f5f0; --ink: #1d2a2d;
      --card: #ffffff; --muted: #5e7176; --gold: #c9a86a; --gold-deep: #3b2f14; --line: #e6e0d3;
    }
    * { margin: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
    .fr { font-family: Fraunces, Georgia, serif; }

    .hero {
      position: relative; text-align: center; color: #f6f0e2; overflow: hidden;
      background: radial-gradient(60rem 32rem at 85% -20%, rgba(201,168,106,.32), transparent 60%), linear-gradient(160deg, #26200f, var(--gold-deep) 55%, #574422);
      padding: clamp(3.5rem, 9vh, 6rem) 1.5rem;
    }
    .home { position: absolute; top: 1.2rem; left: 1.4rem; color: #d9c8a2; text-decoration: none; font-size: .76rem; letter-spacing: .18em; text-transform: uppercase; }
    .home:hover { color: #f6f0e2; }
    .kicker { font-size: .76rem; letter-spacing: .3em; text-transform: uppercase; color: #dcc48f; font-weight: 600; }
    .hero h1 { font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: clamp(2.8rem, 9vw, 4.4rem); margin: 1rem 0 .8rem; }
    .hero .sub { font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 300; font-size: clamp(1.05rem, 3vw, 1.35rem); color: #e6d7b5; max-width: 40ch; margin: 0 auto; }

    main { max-width: 56rem; margin: 0 auto; padding: clamp(2.6rem, 6vh, 4rem) 1.5rem 0; }
    .grid { display: grid; gap: 1.2rem; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); }
    .entry {
      display: flex; flex-direction: column; text-decoration: none; overflow: hidden;
      background: var(--card); border: 1px solid var(--line); border-radius: 1.1rem;
      box-shadow: 0 14px 40px -30px rgba(38,32,15,.4); transition: transform .25s, box-shadow .25s;
    }
    .entry:hover { transform: translateY(-3px); box-shadow: 0 22px 50px -28px rgba(38,32,15,.5); }
    .entry .cover { aspect-ratio: 16 / 10; background: #f1ece1; overflow: hidden; }
    .entry .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* graceful fallback tile when a month has no cover */
    .entry .cover.blank { display: grid; place-items: center; background: linear-gradient(150deg, #26200f, var(--gold-deep) 60%, #574422); }
    .entry .cover.blank span { font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 300; color: #e6d7b5; font-size: 1.4rem; padding: 1rem; text-align: center; }
    .entry .body { padding: 1.3rem 1.4rem 1.5rem; display: flex; flex-direction: column; flex: 1; }
    .entry .date { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
    .entry .topic { font-family: Fraunces, Georgia, serif; font-size: 1.4rem; color: var(--teal-ink); margin-top: .4rem; }
    .entry .sum { font-size: .92rem; color: #45575b; line-height: 1.55; margin-top: .5rem; flex: 1; }
    .entry .go { margin-top: 1.1rem; font-family: Fraunces, Georgia, serif; color: var(--gold-deep); font-size: 1rem; }
    .empty { color: var(--muted); font-style: italic; }
    footer { margin-top: 4rem; padding: 2.6rem 1.5rem 3rem; text-align: center; border-top: 1px solid var(--line); }
    footer a { color: var(--gold-deep); text-decoration: none; border-bottom: 1px solid var(--gold); }
    footer .fine { margin-top: .8rem; font-size: .78rem; color: var(--muted); }
    footer .fine a { border: 0; }
  </style>
</head>
<body>
  <header class="hero">
    <a class="home" href="/mmm">&larr; The Meetup</a>
    <div class="kicker">Monthly Marriage Meetup</div>
    <h1>The Library</h1>
    <p class="sub">Every month we gather, we keep the teaching here. Talks, handouts, and takeaways, free to anyone.</p>
  </header>

  <main>
    <div class="grid" id="grid"><p class="empty">Loading the library…</p></div>
  </main>

  <footer>
    <a href="/mmm">Back to the Meetup</a>
    <div class="fine"><a href="/">mirage.faith</a></div>
  </footer>

  <script>
    (async () => {
      const grid = document.getElementById("grid");
      const data = await fetch("/mmm/library/index.json", { cache: "no-store" }).then(r => r.json()).catch(() => null);
      if (!data || !data.entries || !data.entries.length) {
        grid.innerHTML = '<p class="empty">The first teaching lands after our September gathering. Check back soon.</p>';
        return;
      }
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const fmt = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", month: "long", year: "numeric" });
      grid.innerHTML = data.entries.map(e => {
        const href = e.page ? `/mmm/library/${e.page}` : (e.handout ? `/mmm/library/${e.handout}` : "#");
        const target = e.page ? "" : ' target="_blank" rel="noopener"';
        const cover = e.cover
          ? `<div class="cover"><img src="/mmm/library/${esc(e.cover)}" alt="${esc(e.topic)}"></div>`
          : `<div class="cover blank"><span>${esc(e.topic)}</span></div>`;
        return `<a class="entry" href="${esc(href)}"${target}>
          ${cover}
          <div class="body">
            <div class="date">${esc(fmt(e.date))}</div>
            <div class="topic">${esc(e.topic)}</div>
            <div class="sum">${esc(e.summary || "")}</div>
            <div class="go">${e.page ? "Read the teaching &rarr;" : "Download the handout &rarr;"}</div>
          </div>
        </a>`;
      }).join("");
    })();
  </script>
</body>
</html>
