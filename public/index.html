<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mirage</title>
  <meta name="description" content="mirage.faith">
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100svh; display: grid; place-items: center;
      font-family: Georgia, 'Times New Roman', serif;
      background: light-dark(#faf8f4, #14120f);
      color: light-dark(#25211a, #e8e2d6);
    }
    main { text-align: center; padding: 2rem; }
    h1 {
      font-size: clamp(2.6rem, 9vw, 5rem);
      font-weight: 400; letter-spacing: .28em; text-transform: uppercase;
      margin-left: .28em; /* optically recenters letterspaced text */
    }
    p {
      margin-top: 1.2rem; font-style: italic; font-size: 1.05rem;
      opacity: .55; letter-spacing: .04em;
    }
    hr {
      border: 0; height: 1px; width: 4rem; margin: 2rem auto 0;
      background: currentColor; opacity: .25;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mirage</h1>
    <hr>
    <p>taking shape</p>
  </main>
</body>
</html>
