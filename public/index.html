<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIRAGE</title>
  <meta name="description" content="MIRAGE — Marriage Is Real And Growing Everyday.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100svh; display: grid; place-items: center;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(70rem 40rem at 80% -10%, rgba(100,177,188,.18), transparent 60%),
        light-dark(#f7f5f0, #101b1d);
      color: light-dark(#1d2a2d, #e6ebe9);
      text-align: center;
    }
    main { padding: 2rem; }
    h1 {
      font-family: Fraunces, Georgia, serif; font-weight: 300;
      font-size: clamp(3rem, 11vw, 6.5rem);
      letter-spacing: .3em; margin-left: .3em;
    }
    .expand {
      margin-top: 1rem; font-size: .8rem; letter-spacing: .22em;
      text-transform: uppercase; opacity: .55;
    }
    .cta {
      display: inline-block; margin-top: 2.6rem; text-decoration: none;
      font-family: Fraunces, Georgia, serif; font-size: 1.15rem;
      color: light-dark(#144049, #a9d2d9);
      border: 1px solid light-dark(#64b1bc, #2e5a63);
      border-radius: 2rem; padding: .85rem 2rem;
      transition: background .25s, color .25s;
    }
    .cta:hover { background: #64b1bc; color: #fff; }
    .soon { margin-top: 2.2rem; font-size: .85rem; font-style: italic; opacity: .45; }
  </style>
</head>
<body>
  <main>
    <h1>MIRAGE</h1>
    <div class="expand">Marriage Is Real And Growing Everyday</div>
    <a class="cta" href="/freedom">Freedom · a 12-week journey →</a>
    <div class="soon">Monthly Marriage Meetup — coming this fall</div>
  </main>
</body>
</html>
